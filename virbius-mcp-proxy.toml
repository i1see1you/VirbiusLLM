# virbius-mcp-proxy configuration.
# Loaded from the process working directory (or /etc/virbius/mcp-proxy.toml).
# Environment variables (VIRBIUS_*) override TOML values below.

[llm]
enabled = true
constitution_enabled = true
pii_desensitize = true
prompt_injection_detect = true
output_review_enabled = true
output_review_min_text_length = 512
output_review_min_risk_score = 50
fail_open = true
streaming_passthrough = true
streaming_sync_review_risk_threshold = 50

[[llm.backends]]
name = "ollama"
url = "http://127.0.0.1:11434"
api_key_env = ""
models = ["qwen3.5:9b", "gemma3:4b", "gemma3:1b", "qwen3.5:0.8b"]
