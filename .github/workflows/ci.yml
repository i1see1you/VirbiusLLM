name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests=false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virbius-control/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: virbius-control/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npx playwright test

  ops-console-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: virbius-control/frontend/package-lock.json
      - name: Ops console E2E (real backend)
        run: bash scripts/test-ops-console-e2e.sh

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build virbius-core
        working-directory: virbius-core
        run: cargo build --release
      - name: Test virbius-core
        working-directory: virbius-core
        run: cargo test --release

  rust-gateway-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build virbius-gateway-agent
        working-directory: virbius-gateway-agent
        run: cargo build --release
      - name: Test virbius-gateway-agent
        working-directory: virbius-gateway-agent
        run: cargo test --release

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit virbius-core
        working-directory: virbius-core
        run: cargo audit
      - name: Audit virbius-gateway-agent
        working-directory: virbius-gateway-agent
        run: cargo audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format check
        working-directory: virbius-core
        run: cargo fmt --check
      - name: Rust clippy
        working-directory: virbius-core
        run: cargo clippy -- -D warnings
      - name: Rust format check (gateway-agent)
        working-directory: virbius-gateway-agent
        run: cargo fmt --check
      - name: Rust clippy (gateway-agent)
        working-directory: virbius-gateway-agent
        run: cargo clippy -- -D warnings
      - name: Shell script syntax check
        run: |
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
