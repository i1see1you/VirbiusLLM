[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virbius-assistant"
version = "0.1.0"
description = "VirbiusLLM Responsible Agent Safety Expert"
authors = [{ name = "VirbiusLLM" }]
requires-python = ">=3.9"
dependencies = [
    "fastmcp>=0.4",
    "langgraph>=0.4",
    "langchain-ollama>=0.3",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
